[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zipenhancer"
version = "0.1.0"
description = "语音降噪核心包 — 基于 ZipEnhancer/FRCRN/MossFormer2 模型"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "gao yi jun" },
]

dependencies = [
    "librosa",
    "soundfile",
    "numpy",
    "torch",
    "modelscope[framework]",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "python-dotenv",
]
