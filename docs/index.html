<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZipEnhancer 降噪效果演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh;
    display: flex; justify-content: center; align-items: center; padding: 40px 20px;
  }
  .container { max-width: 800px; width: 100%; }
  h1 {
    font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 8px;
    color: #f0f6fc;
  }
  .subtitle {
    text-align: center; color: #8b949e; margin-bottom: 40px; font-size: 14px;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 24px; margin-bottom: 24px;
  }
  .card h2 {
    font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #f0f6fc;
  }
  .card h2 small { color: #8b949e; font-weight: 400; font-size: 13px; }
  .player-row {
    display: flex; gap: 16px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #21262d;
  }
  .player-row:last-child { border-bottom: none; }
  .label { width: 70px; font-size: 13px; color: #8b949e; flex-shrink: 0; }
  .label .badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600;
  }
  .badge.original { background: #1f6feb22; color: #58a6ff; }
  .badge.denoised { background: #23863622; color: #3fb950; }
  audio { flex: 1; height: 40px; }
  .note {
    text-align: center; font-size: 12px; color: #484f58; margin-top: 24px;
  }
  .note a { color: #58a6ff; text-decoration: none; }
  .note a:hover { text-decoration: underline; }

  /* GitHub Corner */
  .github-corner { position: fixed; top: 0; right: 0; }
  .github-corner svg { fill: #30363d; width: 60px; height: 60px; }
  .github-corner:hover svg { fill: #58a6ff; }
  .github-corner path { fill: transparent; }

  @media (max-width: 600px) {
    .player-row { flex-direction: column; align-items: stretch; }
    .label { width: auto; }
  }
</style>
</head>
<body>

<a href="https://github.com/gyj1201/zipEnhancer" class="github-corner" aria-label="View source on GitHub">

</a>

<div class="container">

  <h1>ZipEnhancer 降噪效果演示</h1>
  <p class="subtitle">阿里达摩院 ZipEnhancer 语音降噪 · 默认模型全力降噪</p>

  <div class="card">
    <h2>样本 1 &nbsp;<small>说话人 + 环境噪声</small></h2>
    <div class="player-row">
      <span class="label"><span class="badge original">带噪</span></span>
      <audio controls src="mp3_audio/speech_with_noise.mp4">您的浏览器不支持 audio 标签</audio>
    </div>
    <div class="player-row">
      <span class="label"><span class="badge denoised">降噪</span></span>
      <audio controls src="mp3_audio/speech_with_noise_denoised.mp4">您的浏览器不支持 audio 标签</audio>
    </div>
  </div>

  <div class="card">
    <h2>样本 2 &nbsp;<small>说话人 + 环境噪声</small></h2>
    <div class="player-row">
      <span class="label"><span class="badge original">带噪</span></span>
      <audio controls src="mp3_audio/speech_with_noise1.mp4">您的浏览器不支持 audio 标签</audio>
    </div>
    <div class="player-row">
      <span class="label"><span class="badge denoised">降噪</span></span>
      <audio controls src="mp3_audio/speech_with_noise1_denoised.mp4">您的浏览器不支持 audio 标签</audio>
    </div>
  </div>

  <p class="note">
    测试音频来自 <a href="https://www.modelscope.cn/models/iic/speech_zipenhancer_ans_multiloss_16k_base">ModelScope 官方 demo</a>
  </p>

</div>

</html>
